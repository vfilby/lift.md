name: '[iOS] CI'

on:
  pull_request:
    branches: [main]

jobs:
  # Path filtering lives at the JOB level (not the workflow `on:` level) so
  # that build-and-test can be a *required* status check. A workflow skipped
  # by an `on: paths:` filter reports no status at all, which leaves a
  # required check pending forever and blocks the merge. A job skipped by
  # `if:` instead reports "skipped", which rulesets count as a pass — so
  # validator-only PRs sail through while iOS PRs are still gated.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'mobile-apps/ios/**'
              - 'e2e-spec/**'
              - '.github/workflows/swift-ci.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: mobile-apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: SwiftLint
        run: |
          # The runner image ships with aws/tap pre-tapped; Homebrew warns on
          # every command about untrusted taps. We don't use it — drop it.
          brew untap aws/tap || true
          brew install swiftlint
          # The baseline was burned down to zero (GH #351); lint runs clean.
          swiftlint lint --strict --reporter github-actions-logging

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          INSTALLED=$(xcodegen --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MINIMUM="2.45.3"
          if [ "$(printf '%s\n' "$MINIMUM" "$INSTALLED" | sort -V | head -n1)" != "$MINIMUM" ]; then
            echo "::error::XcodeGen version too old: need >= $MINIMUM, got $INSTALLED"
            exit 1
          fi

      - name: Write placeholder Sentry xcconfig
        run: |
          # CI builds don't need a real DSN — Sentry init no-ops on empty.
          # But the xcconfig file must exist or xcodegen's configFiles reference fails.
          cat > Config/Sentry.xcconfig <<'EOF'
          // CI placeholder — no DSN. Real DSN written in deploy workflow.
          SENTRY_DSN_REST =
          EOF

      - name: Generate SentryConfig (pre-xcodegen)
        # SentryConfig.swift is gitignored and generated by the Xcode build
        # phase, but xcodegen globs sources before that phase runs — so the file
        # must exist on disk first or it won't be compiled. Empty DSN is fine.
        run: ./scripts/gen-sentry-config.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme LiftMark -project LiftMark.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -scheme LiftMark \
            -project LiftMark.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            | xcpretty

      # PR gate runs the Smoke test plan: the full unit suite plus a render-only
      # UI subset (testSmoke + testTabs). Fast and deterministic enough to gate
      # every PR. The full UI suite — slow, with known flakes (issue #106) — runs
      # nightly via .github/workflows/swift-nightly.yml (-testPlan Full).
      - name: Run smoke tests (unit + UI render gate)
        run: |
          xcodebuild test \
            -scheme LiftMark \
            -project LiftMark.xcodeproj \
            -testPlan Smoke \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      - name: Upload unit test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: mobile-apps/ios/TestResults.xcresult
          retention-days: 7
