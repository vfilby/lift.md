name: Validator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for "redeploy without code change" cases — e.g. rotating
  # a Secrets Manager value the Lambda reads at deploy time, or recovering
  # from a flaky deploy step. Use `gh workflow run Validator --ref main`.
  workflow_dispatch:

# Allow only one full pipeline run per branch at a time.
concurrency:
  group: validator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write   # OIDC: assume the per-env AWS deploy role (no static keys)

jobs:
  # ── Stage 0: changes ───────────────────────────────────────────────────
  # Path filtering lives at the JOB level (not the workflow `on:` level) so
  # that validate/build can stay *required* status checks. A workflow skipped
  # by an `on: paths:` filter reports no status at all, leaving a required
  # check pending forever and blocking the merge. A job skipped by `if:`
  # reports "skipped", which rulesets count as a pass — so iOS-only PRs sail
  # through while validator PRs are still gated. Push-only deploy jobs gate on
  # this output too, so an iOS-only merge to main doesn't redeploy validator.
  changes:
    runs-on: ubuntu-latest
    outputs:
      validator: ${{ steps.filter.outputs.validator }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            validator:
              - 'validator/**'
              - 'website/**'
              # SKILL.md is bundled into the website at build time via ?raw
              # import, so a skill-only change still needs a website rebuild.
              - 'tools/claude-skill/**'
              - '.github/workflows/validator-ci.yml'

  # ── Stage 1: validate ──────────────────────────────────────────────────
  # Matrix gives parallel typecheck + test jobs (mirrors Concourse's
  # validator-typecheck / validator-test fan-out).
  validate:
    name: validate (${{ matrix.check }})
    needs: changes
    # Gate at the STEP level, not the job level. A skipped *matrix* job
    # reports a single check named literally `validate (${{ matrix.check }})`
    # — the matrix never expands — so the required contexts `validate (test)`
    # / `validate (typecheck)` would never report and would block iOS PRs
    # forever. Letting the job run but skipping its steps preserves matrix
    # expansion (correct check names, reported green) while doing no work on
    # non-validator PRs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test]
    defaults:
      run:
        working-directory: validator
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.validator == 'true'
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.validator == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: validator/package-lock.json
      - if: needs.changes.outputs.validator == 'true'
        run: npm ci
      - name: ${{ matrix.check }}
        if: needs.changes.outputs.validator == 'true'
        run: npm run ${{ matrix.check }}

  # ── Stage 2: build ─────────────────────────────────────────────────────
  # Produces validator/dist/ and website/dist/ and uploads both as artifacts
  # so deploy jobs deploy exactly what was tested. CDK's BucketDeployment
  # in stack.ts picks up website/dist at deploy time.
  build:
    name: build
    needs: [changes, validate]
    if: ${{ needs.changes.outputs.validator == 'true' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            validator/package-lock.json
            website/package-lock.json
      - name: Install validator deps
        working-directory: validator
        run: npm ci
      - name: Bundle lambda
        working-directory: validator
        run: make bundle
      - name: Install website deps
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Upload validator bundle
        uses: actions/upload-artifact@v7
        with:
          name: validator-bundle
          path: validator/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload website bundle
        uses: actions/upload-artifact@v7
        with:
          name: website-bundle
          path: website/dist
          # The site ships /.well-known/apple-app-site-association (AASA) for
          # iOS webcredentials. `.well-known` is a hidden directory, and
          # upload-artifact excludes hidden files by default (v4+), which
          # silently dropped the AASA from the bundle so it never reached S3
          # and CloudFront served 403. Keep hidden files so deploy uploads it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ── Stage 2.5: e2e-local ──────────────────────────────────────────────
  # Browser-driven E2E suite (Playwright) against a local validator +
  # website stack with DynamoDB Local + Mailpit. Runs on PR + push so a
  # PR cannot be merged unless the user-facing UI works end-to-end.
  # See spec/services/validator-e2e.md for the contract this suite
  # enforces.
  e2e-local:
    name: e2e-local
    needs: [changes, build]
    if: ${{ needs.changes.outputs.validator == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # NOTE: do NOT use GHA `services:` for DynamoDB Local — the default
    # image command runs WITHOUT `-sharedDb`, so the bootstrap script
    # writes tables into one credential-scoped namespace and the
    # validator (which uses different SDK retries / credential
    # discovery internally) can read from another, leading to
    # ResourceNotFoundException. The repo's docker-compose.yml already
    # passes `-sharedDb`; we re-use it here so CI stays in lock-step
    # with `scripts/e2e-local.sh`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            validator/package-lock.json
            validator/e2e/package-lock.json
            website/package-lock.json
      - name: Install validator deps
        working-directory: validator
        run: npm ci --no-audit --no-fund
      - name: Install website deps
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Install E2E deps
        working-directory: validator/e2e
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: validator/e2e
        run: npx playwright install --with-deps chromium
      - name: Download website bundle
        uses: actions/download-artifact@v8
        with:
          name: website-bundle
          path: website/dist
      - name: Bring up DDB Local + Mailpit
        working-directory: validator
        run: |
          set -euo pipefail
          docker compose up -d
          echo "==> waiting for DynamoDB Local"
          for i in $(seq 1 60); do
            if docker compose ps dynamodb-local --format json 2>/dev/null | grep -q '"Health":"healthy"'; then break; fi
            sleep 0.5
          done
          echo "==> waiting for Mailpit"
          for i in $(seq 1 60); do
            if docker compose ps mailpit --format json 2>/dev/null | grep -q '"Health":"healthy"'; then break; fi
            sleep 0.5
          done
      - name: Bootstrap DynamoDB tables
        working-directory: validator
        run: npx tsx scripts/ddb-local-bootstrap.ts
        env:
          DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
      - name: Start validator + run Playwright
        working-directory: validator
        run: |
          set -euo pipefail
          SECRET="ci-e2e-secret-$(openssl rand -hex 16)"
          export PORT=3001
          export WEBSITE_DIST="$PWD/../website/dist"
          export DDB_ENDPOINT=http://localhost:8000
          export DDB_TABLE_USERS=lmwf-local-users
          export DDB_TABLE_IDENTITIES=lmwf-local-identities
          export DDB_TABLE_PAT_TOKENS=lmwf-local-pat_tokens
          export DDB_TABLE_ENTITLEMENTS=lmwf-local-entitlements
          export DDB_TABLE_REFRESH_TOKENS=lmwf-local-refresh_tokens
          export DDB_TABLE_WORKOUT_INBOX=lmwf-local-workout_inbox
          export DDB_TABLE_WORKOUT_OUTBOX=lmwf-local-workout_outbox
          export AWS_REGION=us-west-2
          export AWS_ACCESS_KEY_ID=local
          export AWS_SECRET_ACCESS_KEY=local
          export SMTP_HOST=localhost
          export SMTP_PORT=1025
          export SMTP_FROM=noreply@local.test
          export JWT_SECRET="ci-jwt-$(openssl rand -hex 16)"
          export E2E_TEST_SECRET="$SECRET"
          export LMWF_ENV=beta
          export BUILD_COMMIT="${{ github.sha }}"
          export BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx tsx src/server.ts > /tmp/validator.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/version >/dev/null 2>&1; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "validator exited during boot"; cat /tmp/validator.log; exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:3001/version || (cat /tmp/validator.log && exit 1)
          cd e2e
          LMWF_E2E_MODE=local \
          LMWF_E2E_BASE_URL=http://localhost:3001 \
          LMWF_E2E_TEST_SECRET="$SECRET" \
          LMWF_E2E_MAILPIT_URL=http://localhost:8025 \
            npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: validator/e2e/playwright-report
          retention-days: 14
      - name: Upload validator log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validator-log
          path: /tmp/validator.log
          retention-days: 14

  # ── Stage 3: deploy-beta ───────────────────────────────────────────────
  # `environment: beta` populates the Deployments tab + can scope secrets
  # (AWS_ACCESS_KEY_ID/SECRET) per environment.
  deploy-beta:
    name: deploy-beta
    needs: [changes, build, e2e-local]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.validator == 'true' && needs.build.result == 'success' && needs['e2e-local'].result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.getlift.md
    env:
      AWS_DEFAULT_REGION: us-west-2
      AWS_REGION: us-west-2
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: validator/package-lock.json
      - name: Install app deps
        working-directory: validator
        run: npm ci --no-audit --no-fund
      - name: Install CDK deps
        working-directory: validator/cdk
        run: npm ci --no-audit --no-fund
      - name: Download validator bundle
        uses: actions/download-artifact@v8
        with:
          name: validator-bundle
          path: validator/dist
      - name: Download website bundle
        uses: actions/download-artifact@v8
        with:
          name: website-bundle
          path: website/dist
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: CDK deploy (beta)
        working-directory: validator/cdk
        run: |
          set -euo pipefail
          BUILD_COMMIT="${{ github.sha }}"
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "==> deploy metadata: commit=$BUILD_COMMIT  builtAt=$BUILD_TIMESTAMP"
          npx cdk deploy \
            --require-approval never \
            --context buildCommit=$BUILD_COMMIT \
            --context buildTimestamp=$BUILD_TIMESTAMP \
            --outputs-file outputs-beta.json \
            LmwfBetaEdgeStack LmwfBetaValidatorStack
          echo "==> outputs:"
          cat outputs-beta.json
      - name: AWS console links (beta)
        run: |
          chmod +x validator/ci/aws-console-links.sh
          validator/ci/aws-console-links.sh beta validator/cdk/outputs-beta.json

  # ── Stage 4: smoke-beta ────────────────────────────────────────────────
  smoke-beta:
    name: smoke-beta
    needs: [changes, deploy-beta]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.validator == 'true' && needs['deploy-beta'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test beta
        run: |
          chmod +x validator/scripts/smoke-test-live.sh
          validator/scripts/smoke-test-live.sh https://beta.getlift.md "${{ github.sha }}"

  # ── Stage 4.5: e2e-beta ────────────────────────────────────────────────
  # Browser-driven E2E suite against the live beta hostname. Uses the
  # /v1/__test__/mint-token endpoint (gated by E2E_TEST_SECRET — beta
  # only) to drive email-verify and password-reset flows without
  # inspecting SES. Blocks deploy-prod.
  #
  # The shared secret is auto-generated by CDK into Secrets Manager as
  # lmwf-beta-e2e-test-secret. This job fetches it at runtime using the
  # beta AWS creds (env-scoped, same as deploy-beta).
  e2e-beta:
    name: e2e-beta
    needs: [changes, smoke-beta]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.validator == 'true' && needs['smoke-beta'].result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: beta
    env:
      AWS_DEFAULT_REGION: us-west-2
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: validator/e2e/package-lock.json
      - name: Install E2E deps
        working-directory: validator/e2e
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: validator/e2e
        run: npx playwright install --with-deps chromium
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch E2E test secret from beta Secrets Manager
        id: get-secret
        run: |
          set -euo pipefail
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id lmwf-beta-e2e-test-secret \
            --query SecretString --output text)
          # Mask before exposing as an output so it never lands in logs.
          echo "::add-mask::$SECRET"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
      # Warm the beta Lambda before the suite runs. deploy-beta ships a
      # fresh function version and smoke-beta only makes a couple of
      # sequential calls (one warm instance); Playwright then hits the API
      # with 4 parallel workers, triggering concurrent cold starts that
      # blew the action/navigation timeouts (sign-out redirect, first PAT
      # create). Fire several concurrent rounds so Lambda scales out and
      # the suite lands on warm instances.
      - name: Warm beta Lambda
        run: |
          set -uo pipefail
          echo "==> warming https://beta.getlift.md"
          for round in 1 2 3; do
            for i in $(seq 1 8); do
              curl -s -o /dev/null --max-time 30 https://beta.getlift.md/version &
            done
            wait
          done
          echo "==> warm-up complete"
      - name: Run Playwright against beta
        working-directory: validator/e2e
        env:
          LMWF_E2E_MODE: remote
          LMWF_E2E_BASE_URL: https://beta.getlift.md
          LMWF_E2E_TEST_SECRET: ${{ steps.get-secret.outputs.secret }}
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-beta
          path: validator/e2e/playwright-report
          retention-days: 14

  # ── Stage 5: deploy-prod ───────────────────────────────────────────────
  # Promotes after smoke-beta AND e2e-beta both pass. To add a manual
  # gate later: Settings → Environments → production → "Required
  # reviewers".
  deploy-prod:
    name: deploy-prod
    needs: [changes, smoke-beta, e2e-beta]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.validator == 'true' && needs['smoke-beta'].result == 'success' && needs['e2e-beta'].result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://getlift.md
    env:
      AWS_DEFAULT_REGION: us-west-2
      AWS_REGION: us-west-2
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: validator/package-lock.json
      - name: Install app deps
        working-directory: validator
        run: npm ci --no-audit --no-fund
      - name: Install CDK deps
        working-directory: validator/cdk
        run: npm ci --no-audit --no-fund
      - name: Download validator bundle
        uses: actions/download-artifact@v8
        with:
          name: validator-bundle
          path: validator/dist
      - name: Download website bundle
        uses: actions/download-artifact@v8
        with:
          name: website-bundle
          path: website/dist
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: CDK deploy (prod)
        working-directory: validator/cdk
        run: |
          set -euo pipefail
          BUILD_COMMIT="${{ github.sha }}"
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "==> deploy metadata: commit=$BUILD_COMMIT  builtAt=$BUILD_TIMESTAMP"
          npx cdk deploy \
            --require-approval never \
            --context buildCommit=$BUILD_COMMIT \
            --context buildTimestamp=$BUILD_TIMESTAMP \
            --outputs-file outputs-prod.json \
            LmwfProdEdgeStack LmwfProdValidatorStack
          echo "==> outputs:"
          cat outputs-prod.json
      - name: AWS console links (prod)
        run: |
          chmod +x validator/ci/aws-console-links.sh
          validator/ci/aws-console-links.sh prod validator/cdk/outputs-prod.json

  # ── Stage 6: smoke-prod ────────────────────────────────────────────────
  smoke-prod:
    name: smoke-prod
    needs: [changes, deploy-prod]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.validator == 'true' && needs['deploy-prod'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test prod
        run: |
          chmod +x validator/scripts/smoke-test-live.sh
          # getlift.md is the canonical site and also proxies the API, so the
          # full smoke (static site + /version + /validate) runs against it.
          validator/scripts/smoke-test-live.sh https://getlift.md "${{ github.sha }}"
      - name: Verify canonical redirect topology
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1" >&2; exit 2; }

          # liftmark.app is redirect-only (GH #248): site pages 301, API 308,
          # AASA served as the sole exception. Mirrors the topology table in
          # spec/services/lmwf-validator.md + validator-e2e.md.

          # 1) Site page: 301 to getlift.md (path preserved).
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://liftmark.app/format)
          echo "liftmark.app/format -> $loc"
          [ "$loc" = "301 https://getlift.md/format" ] || fail "liftmark.app/format should 301 to getlift.md/format, got: $loc"

          # 2) API: 308 (method + body preserved) to getlift.md — NOT served.
          api=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -X POST -H 'Content-Type: application/json' \
            -d '{"markdown":"# T\n## Squat\n- 100 lbs x 5\n"}' https://liftmark.app/validate)
          echo "liftmark.app/validate -> $api"
          [ "$api" = "308 https://getlift.md/validate" ] || fail "liftmark.app/validate should 308 to getlift.md/validate, got: $api"

          # 3) AASA: served directly (200, no redirect) — Apple does not follow
          #    redirects, and installed apps are pinned to liftmark.app.
          aasa=$(curl -s -o /dev/null -w '%{http_code} %{content_type} [%{redirect_url}]' https://liftmark.app/.well-known/apple-app-site-association)
          echo "liftmark.app AASA -> $aasa"
          case "$aasa" in
            "200 application/json"*"[]") : ;;
            *) fail "AASA must be 200/application/json with no redirect, got: $aasa" ;;
          esac

          # 4) Canonical getlift.md serves the API directly (not a redirect).
          gcode=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"markdown":"# T\n## Squat\n- 100 lbs x 5\n"}' https://getlift.md/validate)
          echo "getlift.md/validate -> $gcode"
          [ "$gcode" = "200" ] || fail "getlift.md/validate should be 200 (API served), got: $gcode"

          # 5) Legacy spec host: 301 path-preserving to getlift.md/spec.md.
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://workoutformat.liftmark.app/spec.md)
          echo "workoutformat.liftmark.app/spec.md -> $loc"
          [ "$loc" = "301 https://getlift.md/spec.md" ] || fail "workoutformat.liftmark.app/spec.md should 301 to getlift.md/spec.md, got: $loc"

          # 6) liftmd.app: 301 everything to getlift.md.
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://liftmd.app/)
          echo "liftmd.app/ -> $loc"
          [ "$loc" = "301 https://getlift.md/" ] || fail "liftmd.app/ should 301 to getlift.md/, got: $loc"

          echo "✓ canonical redirect topology verified"
