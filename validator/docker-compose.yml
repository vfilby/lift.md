# Local development services for the validator backend.
# Bring up with `make dev-up` (also bootstraps DDB tables).
# Tear down with `make dev-down`.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: lmwf-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    working_dir: /home/dynamodblocal
    user: root
    healthcheck:
      # DDB Local responds to any request — 400 from a bad request still
      # means the server is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -E '^(200|400)$$'"]
      interval: 2s
      timeout: 2s
      retries: 10

  mailpit:
    # SMTP sink + web UI for local email development. Catches all outbound
    # mail from the validator and exposes it via http://localhost:8025.
    # No persistent volume — captured email is ephemeral by design.
    image: axllent/mailpit:latest
    container_name: lmwf-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + REST API
    healthcheck:
      # Mailpit ships /readyz on the HTTP listener.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/readyz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  dynamodb-data:
    name: lmwf-dynamodb-data
