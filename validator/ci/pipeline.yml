# LMWF validator Concourse pipeline — source of truth, kept in sync with
# .github/workflows/validator-ci.yml. If you change one, change both.
#
# Set/update with:
#   fly -t <target> set-pipeline -p liftmark-validator \
#       -c validator/ci/pipeline.yml \
#       -l validator/ci/vars.local.yml      # local-only, never committed
#
# See validator/ci/README.md for the variable file layout and credential
# bootstrap.

resource_types:
  - name: github-release
    type: registry-image
    source: { repository: concourse/github-release-resource }

resources:
  - name: repo
    type: git
    icon: github
    source:
      uri: https://github.com/vfilby/liftmark.git
      branch: main
      paths:
        - validator/
        - website/
        - .github/workflows/validator-ci.yml
        - liftmark-workout-format/examples/

  - name: node-image
    type: registry-image
    icon: nodejs
    source:
      repository: node
      tag: '22-bookworm-slim'

groups:
  - name: all
    jobs:
      - validate-typecheck
      - validate-test
      - build
      - deploy-beta
      - smoke-beta
      - deploy-prod
      - smoke-prod
  - name: beta
    jobs: [validate-typecheck, validate-test, build, deploy-beta, smoke-beta]
  - name: prod
    jobs: [deploy-prod, smoke-prod]

jobs:
  # ── Stage 1: validate ────────────────────────────────────────────────
  # Two parallel jobs mirror the GHA matrix.
  - name: validate-typecheck
    plan:
      - get: repo
        trigger: true
      - get: node-image
      - task: typecheck
        image: node-image
        config:
          platform: linux
          inputs: [{ name: repo }]
          run:
            path: bash
            args:
              - -euc
              - |
                cd repo/validator
                npm ci --no-audit --no-fund
                npm run typecheck

  - name: validate-test
    plan:
      - get: repo
        trigger: true
      - get: node-image
      - task: test
        image: node-image
        config:
          platform: linux
          inputs: [{ name: repo }]
          run:
            path: bash
            args:
              - -euc
              - |
                cd repo/validator
                npm ci --no-audit --no-fund
                npm test

  # ── Stage 2: build ───────────────────────────────────────────────────
  # Produces validator/dist/ and website/dist/, persisted as a single
  # `bundle` output so deploy jobs work against the exact tested artifact.
  - name: build
    plan:
      - get: repo
        trigger: true
        passed: [validate-typecheck, validate-test]
      - get: node-image
      - task: bundle
        image: node-image
        config:
          platform: linux
          inputs: [{ name: repo }]
          outputs: [{ name: bundle }]
          run:
            path: bash
            args:
              - -euc
              - |
                cd repo/validator
                npm ci --no-audit --no-fund
                make bundle
                cd ../website
                npm ci --no-audit --no-fund
                npm run build
                cd ../..
                mkdir -p bundle/validator bundle/website
                cp -R repo/validator/dist/. bundle/validator/
                cp -R repo/website/dist/.   bundle/website/

  # ── Stage 3: deploy-beta ─────────────────────────────────────────────
  # CDK BucketDeployment (stack.ts) handles the website upload + CF
  # invalidation, so this single `cdk deploy` covers Lambda + site.
  - name: deploy-beta
    serial: true
    plan:
      - get: repo
        trigger: true
        passed: [build]
      - get: bundle
        passed: [build]
      - get: node-image
      - task: cdk-deploy
        image: node-image
        config:
          platform: linux
          inputs:
            - { name: repo }
            - { name: bundle }
          params:
            AWS_ACCESS_KEY_ID:     ((aws_access_key_id_beta))
            AWS_SECRET_ACCESS_KEY: ((aws_secret_access_key_beta))
            AWS_DEFAULT_REGION:    us-west-2
            AWS_REGION:            us-west-2
            CI: 'true'
          run:
            path: bash
            args:
              - -euc
              - |
                # Re-hydrate dist dirs the CDK app expects.
                cp -R bundle/validator/. repo/validator/dist/
                mkdir -p repo/website/dist
                cp -R bundle/website/.   repo/website/dist/
                cd repo/validator
                npm ci --no-audit --no-fund
                cd cdk
                npm ci --no-audit --no-fund
                BUILD_COMMIT=$(cat ../../.git/refs/heads/main 2>/dev/null || git -C ../../.. rev-parse HEAD)
                BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                echo "==> deploy metadata: commit=$BUILD_COMMIT  builtAt=$BUILD_TIMESTAMP"
                npx cdk deploy \
                  --require-approval never \
                  --context buildCommit=$BUILD_COMMIT \
                  --context buildTimestamp=$BUILD_TIMESTAMP \
                  --outputs-file outputs-beta.json \
                  LmwfBetaEdgeStack LmwfBetaValidatorStack
                cat outputs-beta.json

  # ── Stage 4: smoke-beta ──────────────────────────────────────────────
  - name: smoke-beta
    serial: true
    plan:
      - get: repo
        trigger: true
        passed: [deploy-beta]
      - get: node-image
      - task: smoke
        image: node-image
        config:
          platform: linux
          inputs: [{ name: repo }]
          run:
            path: bash
            args:
              - -euc
              - |
                # python3 + curl needed by smoke-test-live.sh.
                apt-get update -qq && apt-get install -y -qq python3 curl >/dev/null
                COMMIT=$(cat repo/.git/refs/heads/main 2>/dev/null || true)
                bash repo/validator/scripts/smoke-test-live.sh \
                  https://beta.liftmark.app "$COMMIT"

  # ── Stage 5: deploy-prod ─────────────────────────────────────────────
  # Auto-promotes after smoke-beta passes. To add a manual gate, set
  # `serial: true` (already on) and remove `trigger: true` from the
  # `get: repo` step — then click the job in the Concourse UI.
  - name: deploy-prod
    serial: true
    plan:
      - get: repo
        trigger: true
        passed: [smoke-beta]
      - get: bundle
        passed: [build]
      - get: node-image
      - task: cdk-deploy
        image: node-image
        config:
          platform: linux
          inputs:
            - { name: repo }
            - { name: bundle }
          params:
            AWS_ACCESS_KEY_ID:     ((aws_access_key_id_prod))
            AWS_SECRET_ACCESS_KEY: ((aws_secret_access_key_prod))
            AWS_DEFAULT_REGION:    us-west-2
            AWS_REGION:            us-west-2
            CI: 'true'
          run:
            path: bash
            args:
              - -euc
              - |
                cp -R bundle/validator/. repo/validator/dist/
                mkdir -p repo/website/dist
                cp -R bundle/website/.   repo/website/dist/
                cd repo/validator
                npm ci --no-audit --no-fund
                cd cdk
                npm ci --no-audit --no-fund
                BUILD_COMMIT=$(cat ../../.git/refs/heads/main 2>/dev/null || git -C ../../.. rev-parse HEAD)
                BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                echo "==> deploy metadata: commit=$BUILD_COMMIT  builtAt=$BUILD_TIMESTAMP"
                npx cdk deploy \
                  --require-approval never \
                  --context buildCommit=$BUILD_COMMIT \
                  --context buildTimestamp=$BUILD_TIMESTAMP \
                  --outputs-file outputs-prod.json \
                  LmwfProdEdgeStack LmwfProdValidatorStack
                cat outputs-prod.json

  # ── Stage 6: smoke-prod ──────────────────────────────────────────────
  - name: smoke-prod
    serial: true
    plan:
      - get: repo
        trigger: true
        passed: [deploy-prod]
      - get: node-image
      - task: smoke
        image: node-image
        config:
          platform: linux
          inputs: [{ name: repo }]
          run:
            path: bash
            args:
              - -euc
              - |
                apt-get update -qq && apt-get install -y -qq python3 curl >/dev/null
                COMMIT=$(cat repo/.git/refs/heads/main 2>/dev/null || true)
                bash repo/validator/scripts/smoke-test-live.sh \
                  https://liftmark.app "$COMMIT"
