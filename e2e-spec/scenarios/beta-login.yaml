name: "Beta — login round-trip"

# Layer-3 e2e (GH #137): exercises the real auth contract against the deployed
# beta backend. Runs ONLY under the BetaE2E test plan — credentials are injected
# per CI run via ${LMWF_E2E_*} env interpolation, and the backend host via
# ${LMWF_E2E_BASE_URL}. See spec/services/ios-e2e-beta.md.

setupOnce:
  - action: launchApp
    newInstance: true
    launchArgs:
      - "--live-backend"
      - "--api-base-url=${LMWF_E2E_BASE_URL}"
      - "--enable-flag=workoutInbox"

tests:
  - name: "should sign in against beta and persist the session"
    steps:
      - action: tap
        target: "tab-settings"
      - action: waitFor
        target: "account-sign-in"
        timeout: 15000
      - action: tap
        target: "account-sign-in"
      # The Settings → Sign-in sheet can drop on the first tap (a SwiftUI
      # re-render during launch settling tears the freshly-presented sheet
      # down — the documented AuthSyncBannerView "needs a second tap" bug).
      # Re-tap if login-email didn't appear. App-side fix tracked as follow-up.
      - action: tryCatch
        try:
          - action: waitFor
            target: "login-email"
            timeout: 5000
        catch:
          - action: tap
            target: "account-sign-in"
      - action: waitFor
        target: "login-email"
        timeout: 15000
      - action: replaceText
        target: "login-email"
        value: "${LMWF_E2E_EMAIL}"
      - action: replaceText
        target: "login-password"
        value: "${LMWF_E2E_PASSWORD}"
      - action: tap
        target: "login-submit"
      # Real network login → the account section flips to signed-in.
      - action: waitFor
        target: "account-identity"
        timeout: 30000
      - action: expect
        target: "account-sign-out"
        assertion: "toExist"

  - name: "should sign out and revoke the session"
    steps:
      - action: waitFor
        target: "account-sign-out"
        timeout: 10000
      - action: tap
        target: "account-sign-out"
      # logout() revokes server-side then clears local tokens → signed-out copy.
      - action: waitFor
        target: "account-sign-in"
        timeout: 20000
